name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel an in-progress run if newer commits land on the same ref.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    env:
      PROJECT: Scout.xcodeproj
      SCHEME: Scout
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deployment target is 26.1, so we need Xcode 26.1 — Xcode 16 cannot build this.
      - name: Select Xcode 26.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Show versions
        run: xcodebuild -version

      # Xcode 26.x ships without the iOS simulator runtime bundled — download it,
      # otherwise there are no iPhone 17 / iOS 26.1 destinations to build against.
      - name: Install iOS 26.1 simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: List available simulators
        run: xcrun simctl list devices available | grep -i "iPhone 17" || true

      # GoogleService-Info.plist is gitignored, so recreate it from a base64 secret.
      # Firebase fatal-errors at launch without it, which would crash the test host.
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST_BASE64 secret. See .github/workflows/ios.yml for setup."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Scout/GoogleService-Info.plist
          plutil -lint Scout/GoogleService-Info.plist

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
