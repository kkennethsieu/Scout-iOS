name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel an in-progress run if newer commits land on the same ref.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    env:
      PROJECT: Scout.xcodeproj
      SCHEME: Scout
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deployment target is 26.1, so we need Xcode 26.1 — Xcode 16 cannot build this.
      - name: Select Xcode 26.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Show versions
        run: xcodebuild -version

      # Cache the downloaded iOS simulator runtime (multi-GB) so it only downloads once.
      - name: Cache iOS simulator runtime
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Images
          key: ios-sim-runtime-26.1

      # Xcode 26.x ships without the iOS simulator runtime bundled. Download it only
      # if the cache restore didn't already provide it (self-healing on a cache miss).
      - name: Ensure iOS 26.1 simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 26.1"; then
            echo "iOS 26.1 runtime present — skipping download."
          else
            echo "iOS 26.1 runtime missing — downloading."
            xcodebuild -downloadPlatform iOS
          fi

      # Cache the cloned Swift Package sources (Firebase, GoogleSignIn) keyed on the
      # resolved versions, so they aren't re-fetched from GitHub every run.
      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      # GoogleService-Info.plist is gitignored, so recreate it from a base64 secret.
      # Firebase fatal-errors at launch without it, which would crash the test host.
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST_BASE64 secret. See .github/workflows/ios.yml for setup."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Scout/GoogleService-Info.plist
          plutil -lint Scout/GoogleService-Info.plist

      # `test` already builds the app + tests, so there's no separate build step.
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
